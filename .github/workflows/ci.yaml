name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit --deny unsound --deny yanked

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  gdscript:
    name: Lint GDScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install gdtoolkit
        run: python3 -m pip install --quiet "gdtoolkit==4.*"
      - name: Run gdlint
        run: python3 -m gdtoolkit.linter $(git ls-files '*.gd')

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        id: clippy
        run: |
          if ! cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy_output.txt; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: steps.clippy.outputs.has_errors == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## CI Check Failed"
            echo ""

            if [ "${{ steps.clippy.outputs.has_errors }}" = "true" ]; then
              echo "### Clippy Warnings/Errors"
              echo ""
              echo "<details>"
              echo "<summary>Output</summary>"
              echo ""
              echo "\`\`\`"
              cat clippy_output.txt
              echo "\`\`\`"
              echo "</details>"
            fi
          } > comment.md

          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md

      - name: Fail if issues found
        if: steps.clippy.outputs.has_errors == 'true'
        run: |
          echo "::error::CI checks failed. See PR comment for details."
          exit 1
